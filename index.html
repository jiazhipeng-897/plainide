<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Code IDE</title>
    <style>
      /* ===== 启动兜底动画（Vue 挂载前显示，挂载后淡出移除） ===== */
      #boot {
        position: fixed;
        inset: 0;
        z-index: 99999;
        background: #0E1518;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        transition: opacity 0.35s ease;
      }
      #boot.boot-done { opacity: 0; pointer-events: none; }

      /* --- 机械齿轮组（虚线边框 = 齿，反向咬合转动） --- */
      #boot .gear { position: relative; border-radius: 50%; }
      #boot .gear-big {
        width: 76px; height: 76px;
        border: 8px dashed #3A6E63;
        animation: boot-gear-spin 9s linear infinite;
      }
      #boot .gear-big::before {
        content: ''; position: absolute; inset: 11px; border-radius: 50%;
        background: radial-gradient(circle at 32% 30%, #1B4A44, #0F2B30 70%);
        border: 1px solid rgba(78, 201, 176, 0.5);
      }
      #boot .gear-big::after {
        content: ''; position: absolute; inset: 26px; border-radius: 50%;
        background: #0E1518; border: 2px solid #4EC9B0;
      }
      #boot .gear-small {
        width: 46px; height: 46px; margin-left: 34px; margin-top: -2px;
        border: 6px dashed #4A5A66;
        animation: boot-gear-spin-rev 5.6s linear infinite;
      }
      #boot .gear-small::before {
        content: ''; position: absolute; inset: 7px; border-radius: 50%;
        background: radial-gradient(circle at 32% 30%, #243D47, #12242B 70%);
        border: 1px solid rgba(156, 220, 254, 0.45);
      }
      #boot .gear-small::after {
        content: ''; position: absolute; inset: 15px; border-radius: 50%;
        background: #0E1518; border: 1.5px solid #9CDCFE;
      }
      /* 能量管线 */
      #boot .pipe {
        position: absolute; border: 1.5px solid rgba(78, 201, 176, 0.22);
        border-radius: 50%; pointer-events: none;
      }
      #boot .pipe-1 { width: 118px; height: 118px; left: 0; top: 0;
        border-left-color: transparent; border-top-color: transparent; }
      #boot .pipe-2 { width: 88px; height: 88px; left: 15px; top: 15px;
        border-right-color: transparent; border-bottom-color: transparent; }
      #boot .pipe .pulse {
        position: absolute; width: 6px; height: 6px; border-radius: 50%;
        background: #4EC9B0; box-shadow: 0 0 8px #4EC9B0;
      }
      #boot .pipe-1 .pulse { left: 8px; top: 8px; animation: boot-pipe-flow1 2.4s linear infinite; }
      #boot .pipe-2 .pulse { right: 6px; top: 6px; animation: boot-pipe-flow2 1.9s linear infinite; }

      #boot .boot-title {
        margin-top: 20px; font-size: 19px; font-weight: 600;
        color: #E6EDF3; letter-spacing: 3px;
        font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      }
      #boot .boot-title em { font-style: normal; color: #4EC9B0; }
      #boot .boot-status {
        margin-top: 8px; font-size: 10px; color: #6A7A82; letter-spacing: 4px;
        font-family: 'Consolas', 'Courier New', monospace;
      }
      #boot .boot-status::after { content: '▍'; color: #4EC9B0;
        animation: boot-caret 0.8s step-end infinite; }

      /* 机械传送带进度 */
      #boot .belt {
        margin-top: 20px; width: 210px; height: 15px; border-radius: 3px;
        background: #141D22; border: 1px solid #22303A; overflow: hidden; position: relative;
      }
      #boot .belt-track {
        position: absolute; inset: 0; width: 200%;
        background: repeating-linear-gradient(90deg, #1E2E34 0 12px, #16242A 12px 24px);
        animation: boot-belt-move 1.1s linear infinite;
      }
      #boot .belt-load {
        position: absolute; inset: 0; width: 62%;
        background: repeating-linear-gradient(90deg,
          rgba(78, 201, 176, 0.28) 0 12px, rgba(78, 201, 176, 0.55) 12px 24px);
        animation: boot-belt-load-move 1.1s linear infinite;
        box-shadow: inset 0 0 6px rgba(78, 201, 176, 0.5);
      }

      @keyframes boot-gear-spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      @keyframes boot-gear-spin-rev { from { transform: rotate(360deg); } to { transform: rotate(0deg); } }
      @keyframes boot-pipe-flow1 {
        0% { transform: translate(0, 0); opacity: 0; }
        15% { opacity: 1; }
        85% { opacity: 1; }
        100% { transform: translate(60px, 60px); opacity: 0; }
      }
      @keyframes boot-pipe-flow2 {
        0% { transform: translate(0, 0); opacity: 0; }
        15% { opacity: 1; }
        85% { opacity: 1; }
        100% { transform: translate(-34px, 34px); opacity: 0; }
      }
      @keyframes boot-caret { 50% { opacity: 0; } }
      @keyframes boot-belt-move { from { transform: translateX(0); } to { transform: translateX(-48px); } }
      @keyframes boot-belt-load-move {
        from { transform: translateX(0); }
        to { transform: translateX(-24px); }
      }
    </style>
  </head>
  <body>
    <div id="boot">
      <div class="pipe pipe-1"><span class="pulse"></span></div>
      <div class="pipe pipe-2"><span class="pulse"></span></div>
      <div class="gear gear-big"></div>
      <div class="gear gear-small"></div>
      <div class="boot-title">My <em>Code</em> IDE</div>
      <div class="boot-status">INITIALIZING SYSTEM</div>
      <div class="belt">
        <div class="belt-track"></div>
        <div class="belt-load"></div>
      </div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
