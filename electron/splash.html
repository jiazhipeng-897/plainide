<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%; background: transparent; overflow: hidden;
    font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  }
  body { display: flex; align-items: center; justify-content: center; }

  .splash { width: 420px; text-align: center; user-select: none; position: relative; }

  /* ===== 主视觉：发光徽标 ===== */
  .stage { position: relative; width: 240px; height: 240px; margin: 0 auto 6px; }

  /* 背景光晕（呼吸） */
  .halo {
    position: absolute; left: 50%; top: 50%; width: 210px; height: 210px;
    margin: -105px 0 0 -105px; border-radius: 50%;
    background: radial-gradient(circle, rgba(78,201,176,0.28) 0%, rgba(156,220,254,0.12) 45%, transparent 70%);
    animation: halo-breathe 3.4s ease-in-out infinite;
    filter: blur(2px);
  }
  .halo::after {
    content: ''; position: absolute; inset: -26px; border-radius: 50%;
    border: 1px solid rgba(78,201,176,0.14);
    animation: halo-ring 5.2s linear infinite;
  }

  /* 徽标主体（透明 PNG）：缓慢悬浮 */
  .logo {
    position: absolute; left: 50%; top: 50%; width: 172px; height: 172px;
    margin: -86px 0 0 -86px;
    animation: logo-float 4.2s ease-in-out infinite;
  }
  .logo img {
    width: 100%; height: 100%; display: block;
    filter: drop-shadow(0 0 18px rgba(78,201,176,0.45))
            drop-shadow(0 0 42px rgba(156,220,254,0.22));
  }

  /* 轨道粒子：三颗光点绕徽标旋转 */
  .orbit { position: absolute; left: 50%; top: 50%; width: 226px; height: 226px;
    margin: -113px 0 0 -113px; animation: orbit-spin 9s linear infinite; }
  .orbit .dot {
    position: absolute; width: 7px; height: 7px; border-radius: 50%;
    background: #7FE0C4; box-shadow: 0 0 12px #4EC9B0, 0 0 24px rgba(78,201,176,0.6);
    animation: dot-pulse 2.2s ease-in-out infinite;
  }
  .orbit .d1 { left: 50%; top: -4px; margin-left: -3.5px; }
  .orbit .d2 { right: -4px; top: 50%; margin-top: -3.5px; animation-delay: .7s; }
  .orbit .d3 { left: 50%; bottom: -4px; margin-left: -3.5px; animation-delay: 1.4s; }
  .orbit2 { position: absolute; left: 50%; top: 50%; width: 186px; height: 186px;
    margin: -93px 0 0 -93px; animation: orbit-spin-rev 13s linear infinite; }
  .orbit2 .dot { width: 5px; height: 5px; border-radius: 50%;
    background: #9CDCFE; box-shadow: 0 0 10px #9CDCFE, 0 0 20px rgba(156,220,254,0.5);
    animation: dot-pulse 2.8s ease-in-out infinite; }
  .orbit2 .e1 { left: -4px; top: 22%; }
  .orbit2 .e2 { right: 6%; top: -4px; animation-delay: 1.1s; }
  .orbit2 .e3 { left: 16%; bottom: -4px; animation-delay: 2s; }

  /* ===== 标题 ===== */
  .title {
    margin-top: 2px; font-size: 25px; font-weight: 700; color: #E8F2F0;
    letter-spacing: 6px; text-shadow: 0 0 22px rgba(78,201,176,0.45);
    animation: title-in 1.1s ease-out both;
  }
  .title em { font-style: normal; color: #4EC9B0; }

  /* ===== 状态行（打字光标） ===== */
  .status {
    margin-top: 9px; font-size: 11px; color: rgba(160,190,195,0.85);
    letter-spacing: 3px; font-family: 'Consolas', 'Courier New', monospace;
    animation: title-in 1.4s .2s ease-out both;
  }
  .status::after { content: '▍'; color: #4EC9B0;
    animation: caret-blink .85s step-end infinite; }

  /* ===== 加载光条（indeterminate） ===== */
  .bar { position: relative; width: 190px; height: 2px; margin: 16px auto 0;
    border-radius: 2px; background: rgba(78,201,176,0.12); overflow: hidden;
    animation: title-in 1.6s .35s ease-out both; }
  .bar i {
    position: absolute; left: -40%; top: 0; width: 40%; height: 100%;
    border-radius: 2px; background: linear-gradient(90deg, transparent, #4EC9B0, transparent);
    animation: bar-flow 1.6s ease-in-out infinite;
  }

  /* ===== Keyframes ===== */
  @keyframes halo-breathe {
    0%, 100% { transform: scale(1); opacity: .85; }
    50% { transform: scale(1.12); opacity: 1; }
  }
  @keyframes halo-ring {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
  @keyframes logo-float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-9px); }
  }
  @keyframes orbit-spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  @keyframes orbit-spin-rev { from { transform: rotate(360deg); } to { transform: rotate(0deg); } }
  @keyframes dot-pulse {
    0%, 100% { opacity: .5; transform: scale(.8); }
    50% { opacity: 1; transform: scale(1.25); }
  }
  @keyframes title-in {
    from { opacity: 0; transform: translateY(10px); filter: blur(4px); }
    to { opacity: 1; transform: translateY(0); filter: blur(0); }
  }
  @keyframes caret-blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
  @keyframes bar-flow {
    0% { left: -40%; }
    100% { left: 100%; }
  }
</style>
</head>
<body>
  <div class="splash">
    <div class="stage">
      <div class="halo"></div>
      <div class="logo"><img src="splash-logo.png" alt="" draggable="false" /></div>
      <div class="orbit">
        <span class="dot d1"></span><span class="dot d2"></span><span class="dot d3"></span>
      </div>
      <div class="orbit2">
        <span class="dot e1"></span><span class="dot e2"></span><span class="dot e3"></span>
      </div>
    </div>
    <div class="title">My <em>Code</em> IDE</div>
    <div class="status">正在初始化工作台</div>
    <div class="bar"><i></i></div>
  </div>
</body>
</html>
